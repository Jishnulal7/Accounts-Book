name: account_book
description: "A new Flutter project."

version: 1.1.1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  build_runner: ^2.4.11
  file_picker: ^10.0.0
  file_saver: ^0.2.14
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_slidable: ^4.0.0
  flutter_speed_dial: ^7.0.0
  flutter_staggered_grid_view: ^0.7.0
  fluttertoast: ^8.2.5
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  hive_ce_generator: ^1.8.2
  hotkey_manager: ^0.2.3
  http: ^1.2.2
  image_picker: ^1.1.1
  intl: ^0.19.0
  logger: ^2.5.0
  month_picker_dialog: ^6.0.3
  open_file: ^3.5.10
  path_provider: ^2.1.3
  provider: ^6.1.2
  pull_to_refresh: ^2.0.0
  rxdart: ^0.28.0
  share_plus: ^10.1.2
  shared_preferences: ^2.2.2
  syncfusion_flutter_charts: ^29.1.33
  syncfusion_flutter_pdf: ^29.1.33
  syncfusion_flutter_pdfviewer: ^29.1.33
  toggle_switch: ^2.3.0
  url_launcher: ^6.2.5
  uuid: ^4.2.2

dev_dependencies:
  collection: ^1.18.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  image_path_android: 'assets/images/app-logo.png'

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/app-logo.png
    - assets/categories/
    - assets/json/HSN_SAC.json
    - assets/json/world.json
  # example:
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
        - asset: assets/fonts/arial.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
